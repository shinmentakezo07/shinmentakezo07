<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07070c"/><stop offset=".7" stop-color="#1a0508"/><stop offset="1" stop-color="#2b0a0f"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#ff3b3b"/><stop offset=".6" stop-color="#c1121f"/><stop offset="1" stop-color="#c1121f" stop-opacity="0"/></radialGradient>
<linearGradient id="blade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.p{animation-fill-mode:both}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),460px) rotate(540deg)}}
@keyframes pulse{0%,100%{r:120;opacity:.9}50%{r:132;opacity:1}}
@keyframes slash{0%,55%{stroke-dashoffset:1400;opacity:0}60%{opacity:1}70%{stroke-dashoffset:0;opacity:1}85%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes reveal{0%{clip-path:inset(0 100% 0 0)}30%,100%{clip-path:inset(0 0 0 0)}}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.3}94%{opacity:1}96%{opacity:.5}97%{opacity:1}}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
@keyframes mist{0%{transform:translateX(0)}100%{transform:translateX(-600px)}}
.name{font:900 76px 'Segoe UI',Impact,sans-serif;letter-spacing:10px;fill:#fff;animation:reveal 1.6s cubic-bezier(.7,0,.2,1) both,flicker 6s 2s infinite}
.sub{font:600 20px 'Fira Code',monospace;letter-spacing:6px;fill:#ff4d6d;animation:rise 1s 1.4s both}
.kanji{font:900 230px serif;fill:#ffffff;opacity:.04}
</style>
<rect width="1200" height="400" fill="url(#sky)"/>
<text x="860" y="300" class="kanji">武蔵</text>
<circle cx="930" cy="170" r="120" fill="url(#sun)" style="animation:pulse 5s ease-in-out infinite"/>
<g opacity=".25" style="animation:mist 40s linear infinite"><path d="M0 300 Q150 270 300 300 T600 300 T900 300 T1200 300 T1500 300 T1800 300 V400 H0Z" fill="#fff"/></g>
<path d="M0 400 L0 330 L120 280 L210 320 L340 250 L470 330 L600 290 L720 340 L860 270 L1000 330 L1100 300 L1200 340 L1200 400Z" fill="#050507"/>
<g transform="translate(980,250)" fill="#050507"><rect x="-4" y="-10" width="8" height="60"/><path d="M-40 -10 H40 L30 -22 H-30Z"/><path d="M-30 6 H30 L22 -2 H-22Z"/></g>
<g style="animation:fall 13.6s linear 3.9s infinite;--dx:94px" class="p"><path transform="translate(663,-20) scale(0.64)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 9.6s linear 0.6s infinite;--dx:-161px" class="p"><path transform="translate(192,-20) scale(1.01)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 10.0s linear 0.7s infinite;--dx:37px" class="p"><path transform="translate(176,-20) scale(0.67)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 12.8s linear 1.2s infinite;--dx:141px" class="p"><path transform="translate(121,-20) scale(0.78)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 13.6s linear 5.8s infinite;--dx:-67px" class="p"><path transform="translate(1193,-20) scale(0.92)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 10.9s linear 1.3s infinite;--dx:96px" class="p"><path transform="translate(95,-20) scale(0.94)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 11.0s linear 5.6s infinite;--dx:-128px" class="p"><path transform="translate(241,-20) scale(1.15)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 11.0s linear 1.9s infinite;--dx:-148px" class="p"><path transform="translate(1191,-20) scale(0.68)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 7.4s linear 2.1s infinite;--dx:38px" class="p"><path transform="translate(1155,-20) scale(1.14)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 10.3s linear 9.2s infinite;--dx:-53px" class="p"><path transform="translate(643,-20) scale(0.89)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="a