s linear 4.0s infinite;--dx:-110px" class="p"><path transform="translate(165,-20) scale(0.82)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g><g style="animation:fall 13.0s linear 2.8s infinite;--dx:3px" class="p"><path transform="translate(881,-20) scale(0.93)" d="M0 0 C6 -8 14 -4 10 4 C8 10 2 10 0 0Z" fill="#ffb7c5" opacity=".85"/></g>
<line x1="40" y1="360" x2="1160" y2="40" stroke="url(#blade)" stroke-width="3" stroke-dasharray="1400" filter="url(#glow)" style="animation:slash 6s ease-out infinite"/>
<text x="80" y="190" class="name">SHINMEN TAKEZO</text>
<rect x="80" y="210" width="90" height="4" fill="#c1121f" style="animation:rise 1s 1.2s both"/>
