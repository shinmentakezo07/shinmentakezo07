<rect x="563" y="179" width="192" height="10" fill="#0b0b0d" style="transform-origin:563px 0;animation:grow 1.2s 0.7s cubic-bezier(.2,.9,.2,1) both"/>
</g><g style="animation:fade .5s 0.7s both">
<text x="560" y="212" class="lbl">GO</text>
<text x="1140" y="212" class="lbl" text-anchor="end">LV.20</text>
<rect x="560" y="222" width="580" height="16" fill="none" stroke="#0b0b0d" stroke-width="3"/>
<rect x="563" y="225" width="115" height="10" fill="#0b0b0d" style="transform-origin:563px 0;animation:grow 1.2s 0.9s cubic-bezier(.2,.9,.2,1) both"/>
</g><g style="animation:fade .5s 0.9s both">
<text x="560" y="258" class="lbl">JAVASCRIPT</text>
<text x="1140" y="258" class="lbl" text-anchor="end">LV.03</text>
<rect x="560" y="268" width="580" height="16" fill="none" stroke="#0b0b0d" stroke-width="3"/>
<rect x="563" y="271" width="18" height="10" fill="#0b0b0d" style="transform-origin:563px 0;animation:grow 1.2s 1.1s cubic-bezier(.2,.9,.2,1) both"/>
</g><g style="animation:fade .5s 1.1s both">
<text x="560" y="304" class="lbl">RUST</text>
<text x="1140" y="304" class="lbl" text-anchor="end">LV.01</text>
<rect x="560" y="314" width="580" height="16" fill="none" stroke="#0b0b0d" stroke-width="3"/>
<rect x="563" y="317" width="8" height="10" fill="#0b0b0d" style="transform-origin:563px 0;animation:grow 1.2s 1.3s cubic-bezier(.2,.9,.2,1) both"/>
</g>
<rect x="6" y="6" width="1188" height="368" fill="none" stroke="#0b0b0d" stroke-width="7"/>
</svg>